name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.1.0
      with:
        persist-credentials: false

    - uses: actions/setup-node@v5.0.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Yarn
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        corepack enable --install-directory "$RUNNER_TEMP/bin"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        export PATH="$RUNNER_TEMP/bin:$PATH"
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.4.0

    - name: Install Calcit modules
      run: caps --ci --strict

    - name: Install JavaScript dependencies
      run: yarn install --immutable

    - name: Verify Calcit toolchain
      run: caps verify --toolchain

    - name: Validate Snapshot
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru analyze dynamic-methods
        calcit calcit.cirru analyze deprecated --summary-only --format json

    - name: Compile website
      run: yarn build

    - name: Deploy to server
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
